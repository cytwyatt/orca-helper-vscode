name: Release & Publish Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check & test
        run: |
          npm run typecheck
          npm test

      - name: Compile extension
        run: npm run compile

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Package VSIX
        run: npx --yes @vscode/vsce@latest package --githubBranch main

      - name: Publish to Visual Studio Marketplace (OIDC Trusted Publishing)
        run: |
          VSIX_FILE=$(ls -1 *.vsix | head -n 1)
          npx --yes @vscode/vsce@latest publish --oidc --packagePath "$VSIX_FILE"

      - name: Create GitHub Release with VSIX
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VSIX_FILE=$(ls -1 *.vsix | head -n 1)
          gh release create "$GITHUB_REF_NAME" "$VSIX_FILE" \
            --title "ORCA 6 Helper $GITHUB_REF_NAME" \
            --generate-notes
